<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Epicast · Feather idle · 2-second breath</title>
<style>
:root{color-scheme:dark;font-family:"Segoe UI",sans-serif;color:#f3ecdc;background:#141914}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;flex-direction:column}
header,footer{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:18px 28px}
header{border-bottom:1px solid #3a4036}h1{font-family:Georgia,serif;font-size:22px;font-weight:normal;margin:0}
header span,footer span{font-size:13px;color:#c2c5b9}
main{flex:1;display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:1px;background:#394034}
figure{margin:0;display:flex;flex-direction:column;min-width:0;background:#212720}
figcaption{padding:14px 20px;color:#d2d8c9;font-size:13px}
.stage{flex:1;display:grid;place-items:center;min-height:0;background:radial-gradient(ellipse,#394239 0,#232b24 68%,#20261f 100%)}
canvas{display:block;max-width:100%;object-fit:contain}#crest{height:min(66vh,560px);width:auto}
#crest.actual{width:162px;height:auto}#detail{width:min(100%,360px);height:auto;max-height:66vh}
footer{flex-wrap:wrap;border-top:1px solid #3a4036}fieldset{border:0;margin:0;padding:0;display:flex;gap:8px;flex-wrap:wrap}
button{border:1px solid #67735e;color:#e9eee4;background:#292f29;border-radius:5px;font:inherit;font-size:14px;padding:8px 16px;cursor:pointer}
button:hover,button:focus-visible{background:#424d3c}button[aria-pressed=true]{background:#dae5c7;color:#1f2b1b}
@media(max-width:650px){header,footer{padding:12px}main{grid-template-columns:1.3fr 1fr}figure figcaption{padding:8px}#crest{height:auto;width:100%}#crest.actual{width:min(162px,100%)}}
</style>
<header><h1>Restoration · Feather idle</h1><span>Epicast</span></header>
<main>
<figure><figcaption>Assembled crest</figcaption><div class="stage"><canvas id="crest" aria-label="Restoration crest with a moving left feather cluster"></canvas></div></figure>
<figure><figcaption>Left feather · attachment detail</figcaption><div class="stage"><canvas id="detail" width="295" height="417" aria-label="Enlarged feather moving under its fixed attachment"></canvas></div></figure>
</main>
<footer><fieldset aria-label="Preview controls">
<button id="toggle" disabled>Pause</button><button id="rest" aria-pressed="false" disabled>Static reference</button><button id="scale" aria-pressed="false">UI size</button>
</fieldset><span id="status" role="status">Loading crest…</span></footer>
<script src="clip.js"></script>
<script>
const byId = id => document.getElementById(id);
const crest = byId("crest"), detail = byId("detail"), statusText = byId("status");
const master = new Image(), sheet = new Image();
const [x, y, w, h] = clip.patch;
[crest.width, crest.height] = clip.crest;
const ctx = crest.getContext("2d"), zoom = detail.getContext("2d");
let elapsed = 0, previous = 0, playing = true, reference = false, last = -1, request = 0;
function paint(frame) {
  if (frame === last) return;
  last = frame;
  ctx.clearRect(x, y, w, h);
  ctx.drawImage(sheet, frame % clip.columns * w, Math.floor(frame / clip.columns) * h, w, h, x, y, w, h);
  zoom.clearRect(0, 0, detail.width, detail.height);
  zoom.drawImage(crest, 0, 408, detail.width, detail.height, 0, 0, detail.width, detail.height);
  crest.dataset.frame = frame;
}
function tick(now) {
  request = 0;
  if (previous) elapsed += now - previous;
  previous = now;
  paint(Math.floor(elapsed * clip.fps / 1000) % clip.frames);
  request = requestAnimationFrame(tick);
}
function refresh() {
  cancelAnimationFrame(request);
  previous = 0;
  if (reference) paint(0);
  else if (playing && !document.hidden) request = requestAnimationFrame(tick);
  byId("toggle").disabled = reference;
  byId("toggle").textContent = playing ? "Pause" : "Play";
  byId("rest").setAttribute("aria-pressed", reference);
  statusText.textContent = reference ? "Static reference" : (playing ? "Idle" : "Paused") +
    ` · ${clip.frames} frames · ${clip.fps} fps · ${clip.frames / clip.fps} s`;
}
byId("toggle").onclick = () => { playing = !playing; refresh(); };
byId("rest").onclick = () => { reference = !reference; if (!reference) { elapsed = 0; paint(0); } refresh(); };
byId("scale").onclick = () => byId("scale").setAttribute("aria-pressed", crest.classList.toggle("actual"));
master.src = "../../concepts/restoration-frame146/Figma%20crest.png";
sheet.src = "review.png";
Promise.all([master.decode(), sheet.decode()]).then(() => {
  ctx.drawImage(master, 0, 0);
  paint(0);
  byId("rest").disabled = false;
  document.addEventListener("visibilitychange", refresh);
  refresh();
}).catch(() => { statusText.textContent = "The crest or its frame sheet could not be loaded."; });
</script></html>
